  <style>
    :root{--teal:#00869a;--green:#07883d;--ink:#263238;--line:#e6e6e6}*{box-sizing:border-box}html,body,#mappa{width:100%;height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden;background:#d7ece8;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}.leaflet-control-attribution{font-size:10px!important}.leaflet-top,.leaflet-bottom{z-index:500}
    #mappa{position:fixed;inset:0;z-index:1}.leaflet-container{background:#c4e6e4}.leaflet-control-zoom{display:none}
    #modalMezzo{position:fixed;inset:0;background:rgba(8,25,32,.58);display:flex;align-items:center;justify-content:center;z-index:4000;padding:20px}.modal-card{position:relative;width:min(440px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 18px 48px #0006}.modal-card h1{font-size:23px;margin:0 0 8px}.modal-card p{color:#657076;margin:0 0 20px}.modal-close{display:none;position:absolute;right:15px;top:11px;background:transparent;font-size:28px;color:#30383b}.modal-change .modal-close{display:block}.mezzo{display:block;width:100%;padding:17px;margin:10px 0;border:1px solid #d7dde0;border-radius:13px;background:#fff;text-align:left;color:#22353b;font-weight:700}.mezzo:hover{border-color:var(--teal);background:#edfafa}.mezzo small{display:block;font-weight:400;color:#657076;margin-top:5px}
    #topbar{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:10px;display:flex;align-items:flex-start;gap:16px;pointer-events:none}.round-btn,.search-shell,.action-round{pointer-events:auto;box-shadow:0 2px 9px #0003}.round-btn{width:68px;height:68px;flex:0 0 68px;border-radius:50%;background:#fff;color:#4d5559;font-size:36px;line-height:1}.round-btn:active,.action-round:active{transform:scale(.96)}.search-area{position:relative;width:min(468px,calc(100vw - 110px))}.search-shell{height:62px;border-radius:31px;background:#fff;display:flex;align-items:center;padding:0 15px 0 29px}.search-shell input{border:0;outline:0;width:100%;font-size:18px;color:#202124;background:transparent}.search-icon,.clear-btn{width:36px;height:36px;background:transparent;color:#566167;font-size:27px;padding:0}.clear-btn{display:none;font-size:30px}.search-area.has-value .clear-btn{display:block}
    .suggestions{display:none;position:absolute;top:60px;left:0;width:100%;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border-radius:0 0 18px 18px;box-shadow:0 6px 12px #0003;padding:6px 0;z-index:1500}.suggestions.open{display:block}.suggestion{display:flex;align-items:center;gap:17px;min-height:57px;padding:10px 23px;cursor:pointer}.suggestion:hover{background:#f4f8f8}.suggestion .pin{font-size:23px;color:#5f676b}.suggestion-main{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.suggestion-detail{font-size:15px;color:#666}.empty{padding:18px 24px;color:#667}
    #directionsButton{display:none;position:absolute;top:84px;left:0;width:78px;height:78px;border-radius:50%;background:var(--teal);color:white;font-size:31px}.search-area.has-value #directionsButton{display:block}
    #routePanel{display:none;position:fixed;z-index:1900;top:0;left:clamp(0px,6vw,104px);width:min(510px,calc(100vw - clamp(0px,6vw,104px)));background:#fff;box-shadow:1px 3px 10px #0002;padding:18px 28px 20px}.panel-close{position:absolute;right:23px;top:8px;background:transparent;font-size:32px;color:#202124}.route-fields{position:relative;padding:38px 48px 10px 52px;border-bottom:1px solid var(--line)}.route-fields:before{content:"";position:absolute;left:18px;top:55px;height:37px;border-left:3px dotted #263238}.field-icon{position:absolute;left:7px;font-size:25px}.origin-icon{top:35px;color:#1473e6}.dest-icon{top:91px;color:#ef3d31}.route-input{height:50px;width:100%;margin-bottom:10px;border:1px solid #777;border-radius:9px;padding:0 45px 0 11px;font-size:17px;outline:none}.route-input:focus{border:2px solid var(--teal)}.swap{position:absolute;right:5px;top:67px;background:transparent;font-size:28px}.panel-search{position:relative}.field-search{position:absolute;right:7px;top:7px;background:transparent;color:var(--teal);font-size:25px}.route-suggestions{position:absolute;left:-80px;right:-28px;top:53px;max-height:330px;z-index:2;border-radius:0;background:#fff;box-shadow:none}.location-choice{display:flex;align-items:center;gap:20px;padding:24px 0 5px;border-top:1px solid #eee;font-size:18px;font-weight:600}.location-choice button{width:52px;height:52px;border-radius:50%;background:#e0f7f9;color:#006d80;font-size:27px}.route-summary{padding:17px 0 0}.route-summary .time{font-size:26px;color:var(--green)}.route-summary .muted{color:#6e7073;font-size:17px;margin-top:8px;line-height:1.4}.start-btn{display:none;margin:18px auto -5px;padding:11px 37px;border-radius:27px;background:var(--teal);color:#fff;font-size:22px}.start-btn.visible{display:block}
    #navTop{display:none;position:fixed;z-index:2100;top:8px;left:8px;right:8px;max-width:550px;background:#007c80;color:#fff;border-radius:14px;padding:13px 24px 12px 78px;box-shadow:0 2px 8px #0004}.nav-arrow{position:absolute;left:24px;top:16px;font-size:40px}.nav-small{font-size:14px}.nav-message{font-size:24px;font-weight:bold;line-height:1.05}

/*---------- BOTTONE "CAMBIO MEZZO" DURANTE NAVIGAZIONE ----------*/

.nav-truck{position:fixed;z-index:2100;top:89px;left:15px;width:66px;height:66px;border-radius:50%;background:#ffca10;font-size:35px;box-shadow:0 2px 7px #0004}

/*-----------------------------------------------------------------*/

.speed-box{display:none;position:fixed;z-index:2100;left:12px;bottom:127px;width:53px;height:53px;border-radius:50%;background:#fff;text-align:center;padding-top:8px;box-shadow:0 1px 5px #0004}.speed-box b{display:block;font-size:18px}.speed-box small{font-size:10px}.compass{display:none;position:fixed;z-index:2100;right:15px;bottom:125px;width:56px;height:56px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 1px 5px #0004}.user-dot{width:22px;height:22px;border-radius:50%;background:#1473e6;border:3px solid #fff;box-shadow:0 1px 5px #0008}.user-marker{background:transparent;border:0}.nav-bottom{display:none;position:fixed;z-index:2100;bottom:0;left:0;right:0;min-height:112px;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 8px #0003;padding:16px 92px;text-align:center}.nav-bottom .eta{font-size:28px;color:var(--green);font-weight:bold}.nav-bottom .remain{color:#72767a;font-size:18px;margin-top:8px}.stop-nav{position:absolute;left:22px;top:20px;width:62px;height:62px;border:2px solid #5f676b;border-radius:50%;background:#fff;font-size:42px;color:#536066}.navigating #topbar,.navigating #routePanel{display:none!important}.navigating #navTop,.navigating .nav-truck,.navigating .speed-box,.navigating .compass,.navigating .nav-bottom{display:block}.navigating #mappa{filter:saturate(1.15) contrast(1.03)}

    @media (max-width: 600px) {
      #topbar {
        left: 8px;
        right: 8px;
        width: calc(100vw - 16px);

	padding: 14px 78px calc(14px + env(safe-area-inset-bottom));
	min-height: 104px;
      }

      }

        right: 10px;
        top: 6px;
        padding: 0;
        display: flex;
        align-items: center;

        z-index: 3000;
      }

      #closePanel::before {

    /* Il comando camion della navigazione è visibile solo durante la guida. */
   #navTruck{display:none}
    .navigating #navTruck{display:block}

<body>
  <div id="mappa"></div>
  <div id="modalMezzo"><div class="modal-card"><button class="modal-close" id="closeMezzo" aria-label="Chiudi">&times;</button><h1>Seleziona il tuo mezzo</h1><p>Imposteremo il percorso con i limiti adatti al veicolo.</p><button class="mezzo" data-type="fino12">&#128666; Autocarri 3,5–12 t<small>Centro 50 · Extraurbane 80 · Autostrada 100 km/h</small></button><button class="mezzo" data-type="oltre12">&#128667; Autocarri oltre 12 t<small>Centro 50 · Extraurbane 70 · Autostrada 80 km/h</small></button><button class="mezzo" data-type="autobus">&#128652; Autobus oltre 8 t<small>Centro 50 · Extraurbane 80 · Autostrada 100 km/h</small></button></div></div>
  <div id="topbar"><button id="truckMenu" class="round-btn" aria-label="Cambia mezzo">&#128666;</button><div class="search-area" id="destinationSearch"><div class="search-shell"><input id="destinationInput" autocomplete="off" placeholder="Cerca" aria-label="Cerca destinazione"><button class="clear-btn" id="clearDestination" aria-label="Cancella">&times;</button><button class="search-icon" aria-label="Cerca">&#8981;</button></div><div id="destinationSuggestions" class="suggestions"></div><button id="directionsButton" class="action-round" aria-label="Ottieni indicazioni">&#10148;</button></div></div>
  <section id="routePanel"><button class="panel-close" id="closePanel" aria-label="Chiudi">&times;</button><div class="route-fields"><span class="field-icon origin-icon">&#9679;</span><span class="field-icon dest-icon">&#9906;</span><div class="panel-search"><input class="route-input" id="originInput" autocomplete="off" placeholder="Scegli il punto di partenza"><button class="field-search" aria-label="Cerca partenza">&#8981;</button><div class="suggestions route-suggestions" id="originSuggestions"></div></div><div class="panel-search"><input class="route-input" id="routeDestinationInput" autocomplete="off" placeholder="Destinazione"><button class="field-search" aria-label="Cerca destinazione">&#8981;</button><div class="suggestions route-suggestions" id="routeDestinationSuggestions"></div></div><button id="swapRoute" class="swap" aria-label="Inverti partenza e arrivo">&#8645;</button></div><div id="locationChoice" class="location-choice"><button id="myLocation" aria-label="La tua posizione">&#8857;</button><span>La tua posizione</span></div><div id="routeSummary" class="route-summary" hidden><div class="time" id="summaryTime"></div><div class="muted" id="summaryDetails"></div><button id="startNavigation" class="start-btn">&#10148;&nbsp; Avvia</button></div></section>
  <div id="navTop"><span class="nav-arrow" id="navArrow">&#8593;</span><div class="nav-small">verso <span id="navStreet">la destinazione</span></div><div class="nav-message" id="navMessage">Prosegui dritto</div></div><button class="nav-truck" id="navTruck" aria-label="Cambia mezzo">&#128666;</button><div class="speed-box" id="speedBox"><b id="speedValue">--</b><small>km/h</small></div><button class="compass" id="recenter" aria-label="Ricentra">&#10148;</button><div class="nav-bottom"><button class="stop-nav" id="stopNavigation" aria-label="Termina">&times;</button><div class="eta" id="etaText"></div><div class="remain" id="remainText"></div></div>
<script>
const TOMTOM_KEY="scdR7UxKrzFdQO9ZC5i5qyYZrgmRVmUK";
const limits={fino12:{urbana:50,extraurbana:80,autostrada:100},oltre12:{urbana:50,extraurbana:70,autostrada:80},autobus:{urbana:50,extraurbana:80,autostrada:100}};

const map=L.map('mappa',{
  zoomControl:false,
  tap: !L.Browser.mobile,
  dragging: true,
  touchZoom: true,
  scrollWheelZoom: true
}).setView([42.5,12.5],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
setTimeout(() => map.invalidateSize(), 300);
window.addEventListener('resize', () => map.invalidateSize());

let mezzo=null,nomeMezzoSelezionato='',destination=null,origin=null,route=null,routeLayer=null,startMarker=null,endMarker=null,userMarker=null,watchId=null,navigation=false,instructions=[],instructionIndex=0,lastPosition=null,offRouteCount=0,lastFixTime=0,recalcTimer=null,arrived=false;

const $=id=>document.getElementById(id);const fmtTime=s=>s>=3600?`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`:`${Math.round(s/60)} min`;const distance=(a,b,c,d)=>{const R=6371e3,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};
function labelFor(r){return r.poi?.name||r.address?.freeformAddress||r.address?.municipality||'Luogo'}function pointFor(r){return {lat:r.position.lat,lon:r.position.lon,label:labelFor(r)}}
function setDestination(p){destination=p;$('destinationInput').value=p.label;$('routeDestinationInput').value=p.label;$('destinationSearch').classList.add('has-value');hideAllSuggestions();map.setView([p.lat,p.lon],12);if(endMarker)map.removeLayer(endMarker);endMarker=L.marker([p.lat,p.lon]).addTo(map)}

function showSuggestions(box, results, onPick){
  box.innerHTML = '';

  if(!results.length){
    box.innerHTML = '<div class="empty">Nessun risultato</div>';
    box.classList.add('open');
    return;
  }

  results.forEach(r => {
    const p = pointFor(r);
    const row = document.createElement('div');
    row.className = 'suggestion';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    const type = r.type === 'POI' ? '&#128651;' : '&#9906;';
    row.innerHTML = `
      <span class="pin">${type}</span>
      <span class="suggestion-main">
        ${escapeHtml(p.label)}
        ${r.address?.municipality ? ` <span class="suggestion-detail">${escapeHtml(r.address.municipality)}</span>` : ''}
      </span>
    `;

    row.addEventListener('pointerdown', e => e.preventDefault());
    row.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      onPick(p);
    });
    row.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        onPick(p);
      }
    });

    box.appendChild(row);
  });

  box.classList.add('open');
}

function hideAllSuggestions(){
  document.querySelectorAll('.suggestions').forEach(x => x.classList.remove('open'));
}

document.querySelectorAll('.suggestions').forEach(box => {
  L.DomEvent.disableClickPropagation(box);
  L.DomEvent.disableScrollPropagation(box);
});

function escapeHtml(s){const e=document.createElement('i');e.textContent=s;return e.innerHTML}
async function search(q,box,pick){if(q.trim().length<3){box.classList.remove('open');return}try{const u=`https://api.tomtom.com/search/2/search/${encodeURIComponent(q)}.json?key=${TOMTOM_KEY}&limit=6&countrySet=IT&idxSet=POI,Geo,Addr,Str`;const d=await (await fetch(u)).json();showSuggestions(box,d.results||[],pick)}catch(e){box.innerHTML='<div class="empty">Ricerca non disponibile</div>';box.classList.add('open')}}

function bindSearch(input, box, pick){
  let timer;

  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => search(input.value, box, pick), 320);
  });

  input.addEventListener('focus', () => {
    if(input.value.length >= 3){
      search(input.value, box, pick);
    }
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      box.classList.remove('open');
    }
  });
}

bindSearch($('destinationInput'),$('destinationSuggestions'),p=>{setDestination(p);hideAllSuggestions()});$('destinationInput').addEventListener('input',()=>{$('destinationSearch').classList.toggle('has-value',$('destinationInput').value.trim().length>0);if(destination&&$('destinationInput').value!==destination.label)destination=null});bindSearch($('originInput'),$('originSuggestions'),p=>{origin={...p,isUser:false};$('originInput').value=p.label;hideAllSuggestions();maybeRoute()});bindSearch($('routeDestinationInput'),$('routeDestinationSuggestions'),p=>{setDestination(p);hideAllSuggestions();maybeRoute()});
document.addEventListener('click',e=>{if(!e.target.closest('.search-area,.panel-search'))hideAllSuggestions()});

document.querySelectorAll('.mezzo').forEach(b => b.onclick = () => {
  mezzo = b.dataset.type;
  nomeMezzoSelezionato = b.textContent.trim().replace(/\s+/g, ' ');
  const icon =
    mezzo === 'fino12' ? '🚚' :
    mezzo === 'oltre12' ? '🚛' :
    '🚌';
  $('truckMenu').textContent = icon;
  $('navTruck').textContent = icon;
  $('modalMezzo').style.display = 'none';
});

/*   document.querySelectorAll('.mezzo').forEach(b => b.onclick = () => {
  mezzo = b.dataset.type;
  nomeMezzoSelezionato = b.textContent.trim().replace(/\s+/g, ' ');
  $('truckMenu').textContent =
    mezzo === 'fino12' ? '🚚' :
    mezzo === 'oltre12' ? '🚛' :
    mezzo === 'autobus' ? '🚌' :
  $('navTruck').textContent = $('truckMenu').textContent;
  $('modalMezzo').style.display = 'none';
}); */

function openMezzo(){
  if(mezzo) $('modalMezzo').classList.add('modal-change');
  $('modalMezzo').style.display = 'flex';
}

$('truckMenu').onclick = openMezzo;
$('navTruck').onclick = () => { stopNavigation(); openMezzo(); };
$('closeMezzo').onclick = () => { $('modalMezzo').style.display = 'none'; };
$('clearDestination').onclick = () => {
  destination = null;
  $('destinationInput').value = '';
  $('routeDestinationInput').value = '';
  $('destinationSearch').classList.remove('has-value');
  clearRoute();
};

function annullaIndicazioni(){
  origin = null;
  destination = null;
  route = null;

  $('destinationInput').value = '';
  $('originInput').value = '';
  $('routeDestinationInput').value = '';
  $('destinationSearch').classList.remove('has-value');
  hideAllSuggestions();
  clearRoute();

  if(endMarker){
    map.removeLayer(endMarker);
    endMarker = null;
  }

  $('routePanel').style.display = 'none';
  setTimeout(() => map.invalidateSize(), 200);
}

$('directionsButton').onclick = async () => {
  const typed = $('destinationInput').value.trim();
  if(!typed) return;

  if(!destination){
    try{
      const u = `https://api.tomtom.com/search/2/search/${encodeURIComponent(typed)}.json?key=${TOMTOM_KEY}&limit=1&countrySet=IT&idxSet=POI,Geo,Addr,Str`;
      const d = await (await fetch(u)).json();
      if(!d.results?.length) throw Error();
      setDestination(pointFor(d.results[0]));
    }catch(e){
      alert('Seleziona una destinazione valida dai suggerimenti.');
      return;
    }
  }

  $('routePanel').style.display = 'block';
  setTimeout(() => map.invalidateSize(), 200);
  $('routeDestinationInput').value = destination.label;
  $('originInput').focus();
};

$('closePanel').onclick = () => {
  origin = null;
  destination = null;
  route = null;

  $('destinationInput').value = '';
  $('originInput').value = '';
  $('routeDestinationInput').value = '';

  $('destinationSearch').classList.remove('has-value');
  $('routeSummary').hidden = true;
  $('routePanel').style.display = 'none';

  hideAllSuggestions();
  clearRoute();

  if(endMarker){
    map.removeLayer(endMarker);
    endMarker = null;
  }

  document.body.classList.remove('navigating');
  setTimeout(() => map.invalidateSize(), 200);
};

$('swapRoute').onclick=()=>{if(!origin||origin.isUser||!destination)return;const old=origin;origin={...destination,isUser:false};setDestination(old);$('originInput').value=origin.label;maybeRoute()};
$('myLocation').onclick=()=>{if(!navigator.geolocation){alert('La geolocalizzazione non è disponibile su questo dispositivo.');return}$('originInput').value='Ricerca posizione…';navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lon:p.coords.longitude,label:'La tua posizione',isUser:true};$('originInput').value='La tua posizione';maybeRoute()},e=>{alert('Attiva il GPS e consenti la geolocalizzazione per usare la tua posizione.');$('originInput').value=''} ,{enableHighAccuracy:true,timeout:12000})};
function clearRoute(){if(routeLayer)map.removeLayer(routeLayer);if(startMarker)map.removeLayer(startMarker);routeLayer=startMarker=null;route=null;$('routeSummary').hidden=true}
async function maybeRoute(){if(!origin||!destination||!mezzo)return;clearRoute();try{const u=`https://api.tomtom.com/routing/1/calculateRoute/${origin.lat},${origin.lon}:${destination.lat},${destination.lon}/json?key=${TOMTOM_KEY}&travelMode=truck&vehicleMaxSpeed=80&vehicleWidth=2.5&vehicleHeight=4&vehicleLength=17&vehicleWeight=20000&routeType=fastest&language=it-IT&instructionsType=text`;const d=await (await fetch(u)).json();if(!d.routes?.length)throw Error();route=d.routes[0];const points=route.legs.flatMap(l=>l.points.map(p=>[p.latitude,p.longitude]));instructions=(route.guidance?.instructions||[]).filter(i=>i.point).map(i=>({lat:i.point.latitude,lon:i.point.longitude,msg:i.message||'Prosegui dritto',street:i.street||i.signpostText||'',maneuver:i.maneuver||''}));routeLayer=L.polyline(points,{color:'#3210d8',weight:6,opacity:.9}).addTo(map);startMarker=L.marker([origin.lat,origin.lon]).addTo(map);if(endMarker)map.removeLayer(endMarker);endMarker=L.marker([destination.lat,destination.lon]).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,50]});const km=Math.round(route.summary.lengthInMeters/1000);$('summaryTime').innerHTML=`${fmtTime(route.summary.travelTimeInSeconds)} <span style="color:#333;font-weight:normal">(${km} km)</span>`;

$('summaryDetails').textContent = origin.isUser
  ? 'Percorso per il tuo mezzo'
  : `Percorso calcolato per ${nomeMezzoSelezionato || 'il tuo mezzo'}`;

$('routeSummary').hidden=false;$('startNavigation').classList.toggle('visible',origin.isUser)}catch(e){alert('Non è stato possibile calcolare il percorso. Verifica i punti selezionati.')}}
$('startNavigation').onclick=()=>{if(route&&origin?.isUser)startNavigation()};

function startNavigation(){
  navigation=true;
  arrived=false;
  instructionIndex=0;
  offRouteCount=0;
  lastFixTime=0;
  document.body.classList.add('navigating');

/*-----------------------BUONA STRADA---------------------*/

$('etaText').textContent='Buona Strada!';
$('remainText').textContent='';
setTimeout(() => {
  if(navigation && !arrived){
    $('etaText').textContent='';
  }
}, 5000);

/*-------------------------------------------------------*/

  $('summaryDetails').textContent=`Percorso per ${nomeMezzoSelezionato || 'il tuo mezzo'}`;
  $('routePanel').style.display='none';
  setTimeout(()=>map.invalidateSize(),200);
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(updateNavigation,(err)=>{if(err.code!==3&&!arrived) alert('GPS non disponibile.')},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})
}

function stopNavigation(){navigation=false;document.body.classList.remove('navigating');if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;if(userMarker){map.removeLayer(userMarker);userMarker=null}}$('stopNavigation').onclick=stopNavigation;
function getArrow(m){return({TURN_LEFT:'&#8592;',TURN_RIGHT:'&#8594;',TURN_SHARP_LEFT:'&#11013;',TURN_SHARP_RIGHT:'&#10145;',TURN_SLIGHT_LEFT:'&#8598;',TURN_SLIGHT_RIGHT:'&#8599;'})[m]||'&#8593;'}

function clearNavigationArtifacts(){
  if(userMarker){
    map.removeLayer(userMarker);
    userMarker=null;
  }
  if(recalcTimer){
    clearTimeout(recalcTimer);
    recalcTimer=null;
  }
}

function getRouteUrl(o,d){
  return `https://api.tomtom.com/routing/1/calculateRoute/${o.lat},${o.lon}:${d.lat},${d.lon}/json?key=${TOMTOM_KEY}&travelMode=truck&vehicleMaxSpeed=80&vehicleWidth=2.5&vehicleHeight=4&vehicleLength=17&vehicleWeight=20000&routeType=fastest&language=it-IT&instructionsType=text&computeBestOrder=false`;
}

function buildRouteData(d){
  route=d.routes[0];
  const points=route.legs.flatMap(l=>l.points.map(p=>[p.latitude,p.longitude]));
  instructions=(route.guidance?.instructions||[]).filter(i=>i.point).map(i=>({lat:i.point.latitude,lon:i.point.longitude,msg:i.message||'Prosegui dritto',street:i.street||i.signpostText||'',maneuver:i.maneuver||''}));
  if(routeLayer) map.removeLayer(routeLayer);
  routeLayer=L.polyline(points,{color:'#3210d8',weight:6,opacity:.9,smoothFactor:1}).addTo(map);
  if(startMarker) map.removeLayer(startMarker);
  startMarker=L.marker([origin.lat,origin.lon]).addTo(map);
  if(endMarker) map.removeLayer(endMarker);
  endMarker=L.marker([destination.lat,destination.lon]).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[50,50]});
  $('summaryTime').innerHTML=`${fmtTime(route.summary.travelTimeInSeconds)} <span style="color:#333;font-weight:normal">(${Math.round(route.summary.lengthInMeters/1000)} km)</span>`;
  $('summaryDetails').textContent=origin.isUser?'Percorso per il tuo mezzo':`Percorso calcolato per ${nomeMezzoSelezionato || 'il tuo mezzo'}`;
  $('routeSummary').hidden=false;
  $('startNavigation').classList.toggle('visible',origin.isUser);
}

async function maybeRoute(){
  if(!origin||!destination||!mezzo) return;
  clearRoute();
  try{
    const d=await (await fetch(getRouteUrl(origin,destination))).json();
    if(!d.routes?.length) throw Error();
    buildRouteData(d);
  }catch(e){
    alert('Non è stato possibile calcolare il percorso. Verifica i punti selezionati.');
  }
}


function getArrow(m){return({TURN_LEFT:'&#8592;',TURN_RIGHT:'&#8594;',TURN_SHARP_LEFT:'&#11013;',TURN_SHARP_RIGHT:'&#10145;',TURN_SLIGHT_LEFT:'&#8598;',TURN_SLIGHT_RIGHT:'&#8599;'})[m]||'&#8593;'}

function nextInstructionForPosition(lat,lon){
  while(instructionIndex<instructions.length-1 && distance(lat,lon,instructions[instructionIndex].lat,instructions[instructionIndex].lon)<35) instructionIndex++;
  return instructions[instructionIndex]||{msg:'Prosegui dritto',street:'la destinazione',maneuver:''};
}

function scheduleReroute(lat,lon){
  if(recalcTimer) return;
  recalcTimer=setTimeout(async()=>{
    recalcTimer=null;
    if(!navigation||arrived||!destination) return;
    try{
      const d=await (await fetch(getRouteUrl({lat,lon},destination))).json();
      if(d.routes?.length){
        buildRouteData(d);
      }
    }catch(e){}
  },3500);
}

function finalizeArrival(){
  arrived=true;
  navigation=false;
  document.body.classList.remove('navigating');
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=null;
  clearNavigationArtifacts();
  $('navMessage').textContent='Sei arrivato a destinazione';
  $('navStreet').textContent='';
  $('navArrow').innerHTML='&#127937;';
  $('speedValue').textContent='0';
  $('etaText').textContent='';
  $('remainText').textContent='Sei arrivato a destinazione';
  $('navBottom').style.display='block';
  $('navTop').style.display='block';
  $('routePanel').style.display='none';
}

function updateNavigation(pos){
  if(arrived) return;

  const lat=pos.coords.latitude, lon=pos.coords.longitude, spd=(pos.coords.speed||0)*3.6;
  const now=Date.now();

  if(lastPosition){
    const d=distance(lastPosition.lat,lastPosition.lon,lat,lon);
    const dt=Math.max(1,(now-lastFixTime)/1000);
    const target=route?.summary?.lengthInMeters ? Math.max(2.5,Math.min(18,(route.summary.lengthInMeters/1000)*0.03)) : 8;
    const alpha=1-Math.exp(-dt/target);
    const smoothLat=lastPosition.lat+(lat-lastPosition.lat)*alpha;
    const smoothLon=lastPosition.lon+(lon-lastPosition.lon)*alpha;
    lastPosition={lat:smoothLat,lon:smoothLon};

    if(!userMarker){
      userMarker=L.marker([smoothLat,smoothLon],{icon:L.divIcon({className:'user-marker',html:'<div class="user-dot"></div>'})}).addTo(map);
    }else{
      userMarker.setLatLng([smoothLat,smoothLon]);
    }

    map.setView([smoothLat,smoothLon],18,{animate:true});

    if(distance(smoothLat,smoothLon,destination.lat,destination.lon)<45){
      $('speedValue').textContent='0';
      $('navMessage').textContent='Sei arrivato a destinazione';
      $('navStreet').textContent='';
      $('remainText').textContent='Sei arrivato a destinazione';
      finalizeArrival();
      return;
    }

    if(d>120){
      offRouteCount++;
      if(offRouteCount>=2) scheduleReroute(smoothLat,smoothLon);
    }else{
      offRouteCount=0;
    }
  }else{
    lastPosition={lat,lon};
    if(!userMarker){
      userMarker=L.marker([lat,lon],{icon:L.divIcon({className:'user-marker',html:'<div class="user-dot"></div>'})}).addTo(map);
    }else{
      userMarker.setLatLng([lat,lon]);
    }
    map.setView([lat,lon],18,{animate:true});
  }

  lastFixTime=now;
  const p=lastPosition||{lat,lon};
  $('speedValue').textContent=Math.round(spd);

  const i=nextInstructionForPosition(p.lat,p.lon);
  $('navArrow').innerHTML=getArrow(i.maneuver);
  $('navMessage').textContent=i.msg;
  $('navStreet').textContent=i.street||'la destinazione';

  const remaining=Math.max(0,Math.round(distance(p.lat,p.lon,destination.lat,destination.lon)/1000));
  const etaSec=Math.max(0,Math.round((route?.summary?.travelTimeInSeconds||0) * (remaining / Math.max(1,Math.round(route?.summary?.lengthInMeters/1000)))));
  const eta=new Date(Date.now()+etaSec*1000);

  $('etaText').textContent=etaSec?fmtTime(etaSec):'';
  $('remainText').textContent=etaSec ? `${remaining} km · arrivo ${eta.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}` : 'Sei arrivato a destinazione';
}


$('recenter').onclick=()=>lastPosition&&map.setView([lastPosition.lat,lastPosition.lon],18);
</script></body></html>
